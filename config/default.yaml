# Phase 1 defaults. These are fixed BEFORE testing. Do not tune risk values for returns.

data:
  symbols: [BTCUSDT, ETHUSDT]
  interval: 15m
  start: "2020-01"          # first month to download (YYYY-MM)
  raw_dir: data/raw
  processed_dir: data/processed
  holdout_months: 12        # most recent N months are locked until Phase 1 ends

smc:
  swing_n: 3                # bars on each side for a swing point
  atr_period: 14
  displacement_body_atr: 1.2
  displacement_close_frac: 0.25   # close within outer 25% of range
  fvg_min_atr: 0.1
  htf_rule: 1h              # higher-timeframe bias timeframe
  htf_swing_n: 3

strategy:
  setup_window: 20          # bars from sweep to structure break
  entry_valid_bars: 16
  stop_buffer_atr: 0.1
  target_r: 2.0
  time_exit_bars: 96

costs:
  maker_fee: 0.0002         # Binance USD-M VIP0 at time of writing; verify
  taker_fee: 0.0005
  slippage_bps: 2.0         # applied to taker (stop / time-exit) fills
  multiplier: 1.0           # 2.0 for the cost-stress run

risk:
  initial_equity: 10000.0
  risk_normal: 0.005
  risk_elevated_vol: 0.0025
  risk_drawdown_5: 0.0015
  drawdown_reduce: 0.05
  drawdown_halt: 0.08
  vol_percentile: 0.80
  vol_lookback_bars: 2880   # 30 days of M15
  max_daily_loss: 0.02
  max_weekly_loss: 0.04
  max_open_risk: 0.015
  max_leverage: 3.0
  max_consecutive_losses: 6
  loss_pause_bars: 96
  max_positions_per_symbol: 1

walkforward:
  train_months: 24
  test_months: 6
  step_months: 6
  min_train_trades: 30
  grid:
    swing_n: [2, 3, 5]
    target_r: [1.5, 2.0, 3.0]

kill_criteria:
  min_oos_trades: 200
  min_profit_factor: 1.2
  min_sharpe: 1.0
  min_profit_factor_2x_costs: 1.0
  min_profitable_fold_frac: 0.6

# One bot, five sub-bots. Each sub-bot trades the FULL account on its own
# (risk.initial_equity, own risk engine, own trades) and is reported separately.
# There is no combined portfolio. Parameters are fixed before testing.
bots:
  report_start: "2020-04-01"    # after indicator warm-up
  sleeves:
    smc:
      enabled: true
      status: shelved           # failed Phase 1 kill criteria (2026-09-25); kept as a baseline
    trend_pullback:
      enabled: true
      stop_atr: 2.0
      trail_atr: 3.0
      time_exit_bars: 480
    vol_breakout:
      enabled: true
      squeeze_pct: 0.20
      vol_mult: 1.5
      stop_atr: 1.5
      trail_atr: 2.5
      time_exit_bars: 192
    vwap_reversion:
      enabled: true
      dev_atr: 2.5
      rsi_lo: 25
      stop_atr: 1.5
      time_exit_bars: 32
    funding_momentum:
      enabled: true
      funding_baseline: 0.0001
      stop_atr: 3.0
      time_exit_bars: 96
    trend_pullback_trendfilter:
      enabled: false            # paper-traded only (registered 2026-09-25); not part of the default `pte bots` run
      base: trend_pullback
      direction_filter: trend   # longs only above the 200-day average, shorts only below
      stop_atr: 2.0
      trail_atr: 3.0
      time_exit_bars: 480
